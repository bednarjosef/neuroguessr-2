[project]
name = "neuroguessr-2"
version = "0.1.0"
description = "Single-image geolocalization: geocell classifier + gated retrieval over 1.2M Street View images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.34",
    "datasets>=3.0",
    "huggingface_hub>=0.25",
    "matplotlib>=3.10.8",
    "numpy>=1.26",
    "pandas>=2.3.3",
    "peft>=0.13",
    "pillow>=10.0",
    "pyarrow>=21.0.0",
    "requests>=2.32.0",
    "safetensors>=0.4",
    "transformers>=4.55",
    "wandb>=0.18",
    "torch==2.9.1",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
